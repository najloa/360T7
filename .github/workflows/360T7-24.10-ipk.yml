name: 360T7-24.10-ipk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Initialization environment
      run: sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

    - name: Download OpenWrt SDK 24.10
      run: |
        wget -O sdk.tar.zst https://downloads.openwrt.org/releases/24.10.0/targets/mediatek/filogic/openwrt-sdk-24.10.0-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        mkdir sdk
        tar -xf sdk.tar.zst -C sdk --strip-components=1

    - name: Setup feeds
      run: |
        cd sdk

        sed -i \
            -e 's|git\.openwrt\.org/feed|github.com/openwrt|g' \
            -e 's|git\.openwrt\.org/project|github.com/openwrt|g' \
            -e 's|git\.openwrt\.org/openwrt|github.com/openwrt|g' \
            "feeds.conf.default"

        cat > feeds.tmp <<'EOF'
        src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
        src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
        EOF
        cat feeds.conf.default >> feeds.tmp
        mv feeds.tmp feeds.conf.default

        ./scripts/feeds update -a
        ./scripts/feeds install -a

        rm -rf ./feeds/packages/lang/golang && git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
        # 替换规则
        sed -i '/gfwlist\/gfwlist"/a\o:value("https://github.com/najloa/geoip/releases/latest/download/proxy.txt", translate("najloa/proxy"))' ./feeds/luci/applications/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/ChinaMax_Domain"/a\o:value("https://github.com/najloa/geoip/releases/latest/download/cn.txt", translate("najloa/cn"))' ./feeds/luci/applications/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/MetaCubeX\/geosite (CDN)"/a\	o:value("https://github.com/najloa/geoip/releases/latest/download/geosite.dat", translate("najloa/geosite"))' ./feeds/luci/applications/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/MetaCubeX\/geoip (CDN)"/a\	o:value("https://github.com/najloa/geoip/releases/latest/download/geoip.dat", translate("najloa/geoip"))' ./feeds/luci/applications/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i 's|local excluded_domain = {[^}]*}|local excluded_domain = {}|g' ./feeds/luci/applications/luci-app-passwall/root/usr/share/passwall/rule_update.lua
        > ./feeds/luci/applications/luci-app-passwall/root/usr/share/passwall/rules/chnlist
        curl -s https://core.telegram.org/resources/cidr.txt > /tmp/telegram_cidr.txt && grep -Fvxf /tmp/telegram_cidr.txt ./feeds/luci/applications/luci-app-passwall/root/usr/share/passwall/rules/proxy_ip > /tmp/proxy_ip_cleaned && cat /tmp/telegram_cidr.txt >> /tmp/proxy_ip_cleaned && mv /tmp/proxy_ip_cleaned ./feeds/luci/applications/luci-app-passwall/root/usr/share/passwall/rules/proxy_ip && rm /tmp/telegram_cidr.txt

    - name: Compile
      run: |
        cd sdk
        echo "CONFIG_ALL_NONSHARED=n" > .config
        echo "CONFIG_ALL_KMODS=n" >> .config
        echo "CONFIG_ALL=n" >> .config
        echo "CONFIG_AUTOREMOVE=n" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config
        echo "CONFIG_PACKAGE_geoview=m" >> .config
        echo "CONFIG_PACKAGE_sing-box=m" >> .config
        echo "CONFIG_PACKAGE_xray-core=m" >> .config
        make defconfig
        echo "make package/luci-app-passwall/{clean,compile} -j$(nproc)"
        make package/luci-app-passwall/{clean,compile} -j$(nproc) V=s
        echo "make package/geoview/{clean,compile} -j$(nproc)"
        make package/geoview/{clean,compile} -j$(nproc) V=s
        echo "make package/sing-box/{clean,compile} -j$(nproc)"
        make package/sing-box/{clean,compile} -j$(nproc) V=s
        echo "make package/xray-core/{clean,compile} -j$(nproc)"
        make package/xray-core/{clean,compile} -j$(nproc) V=s

    - name: Generate build date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: IPK files
      run: |
        mkdir ipk-out
        find ./ -type f -name '*passwall*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*geoview*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*xray*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*sing-box*.ipk' -exec cp {} ipk-out/ \;

    - name: Pack IPK files
      run: |
        cd ipk-out
        zip -r ../24.10-ipk.zip .

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 24.10
        overwrite: true
        files: 24.10-ipk.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        keep_minimum_runs: 2
        delete_workflow_pattern: 360T7-24.10-ipk
