name: 360T7-openwrt-config

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Initialization environment
      run: sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

    - name: download
      run: git clone -b openwrt-25.12 https://github.com/openwrt/openwrt.git

    - name: pw
      run: |
        cd openwrt
        printf '%s\n' \
        "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" \
        "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" \
        | cat - feeds.conf.default > tmp && mv tmp feeds.conf.default
        echo "===== feeds.conf.default 更新成功 ====="
        cat feeds.conf.default

    - name: update
      run: cd openwrt && ./scripts/feeds update -a

    - name: install
      run: cd openwrt && ./scripts/feeds install -a

    #【输入q 然后cd openwrt && make menuconfig】【结束sudo touch /continue】【https://github.com/mxschmitt/action-tmate】
    
    - name: Setup tmate session
      uses: Warpbuilds/action-debugger@v1.3
      timeout-minutes: 50

    - name: cp config
      run: |
        cd openwrt
        install -Dp .config ./publish/openwrt-25.12.config

    - name: Sync publish to repo config folder
      run: |
        mkdir -p config
        cp -rf openwrt/publish/* config/

    - name: Commit and push configs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add config/
        git commit -m "update configs (publish sync)" || echo "No changes to commit"
        git push

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
