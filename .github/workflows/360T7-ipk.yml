#    - name: config
#      run: |
#        cd immortalwrt-mt798x
#        cp -f .config ipk.config

#    - name: Upload artifact
#      uses: actions/upload-artifact@v4
#      with:
#        name: config
#        path: immortalwrt-mt798x/ipk.config

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
