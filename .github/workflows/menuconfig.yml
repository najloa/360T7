name: menuconfig

on:
  workflow_dispatch:
    inputs:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go version

      - name: environment
        run: sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Download
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git
          cd immortalwrt-mt798x
          # 第一步：添加 passwall feed
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> "feeds.conf.default"
          echo "src-git passwall-packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> "feeds.conf.default"
          # 第二步：更新所有 feed（下载最新包）
          #./scripts/feeds update -a

          # 版本
          #grep PKG_VERSION feeds/passwall/luci-app-passwall/Makefile

          # 第三步：删除 luci feed 中的旧版本（必须！就是为了防止 install -a 拉回来）
          #rm -rf feeds/luci/applications/luci-app-passwall
          # 删除
          #rm -rf feeds/packages/net/chinadns-ng
          # 第四步（可选）：清除以前装的链接
          #rm -rf package/feeds/luci/luci-app-passwall
          # 第五步：安装 passwall 中的包
          #./scripts/feeds install -a -p passwall
          # 第六步：现在可以放心全装了，luci 的版本已不会被拉回
          #./scripts/feeds install -a
          cp -f defconfig/mt7981-ax3000.config .config

      - name: 【步骤】
        run: echo "【输入q 然后cd immortalwrt-mt798x && make menuconfig 结束sudo touch /continue】"

      - name: Setup tmate session # https://github.com/mxschmitt/action-tmate https://github.com/marketplace/actions/debugging-with-ssh
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 50

      - name: config
        run: |
          cd immortalwrt-mt798x
          cp -f .config hanwckf.config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: |
            immortalwrt-mt798x/hanwckf.config

      - name: make
        run: |
          cd immortalwrt-mt798x
          make -j$(nproc)

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 0
