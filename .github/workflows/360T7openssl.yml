name: 360T7openssl

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        required: true
        type: choice
        default: 'openwrt-25.12'
        options:
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'
          - 'immortalwrt-25.12-dae'
          - 'openwrt-25.12'
          - 'openwrt-25.12-ubi'

permissions:
  contents: write
  actions: write

env:
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set build configuration
      run: |
        case "${{ inputs.version }}" in
          immortalwrt-21.02)
            echo "REPO_URL=https://github.com/hanwckf/immortalwrt-mt798x" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-21.02" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-21.02.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-21.02.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12-dae)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-25.12-dae.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-25.12-dae.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12-dae" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12-dae" >> $GITHUB_ENV
            ;;
          openwrt-25.12)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12" >> $GITHUB_ENV
            ;;
          openwrt-25.12-ubi)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-ubi.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            ;;
          *)
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
            ;;
        esac

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile OpenSSL and collect diagnostics
      run: |
        set -o pipefail
        cd openwrt
    
        make package/libs/openssl/clean
        make package/libs/openssl/compile V=s 2>&1 \
          | tee "$GITHUB_WORKSPACE/openssl-build.log"
    
        {
          echo "===== OpenSSL configdata.pm ====="
          find build_dir -type f -name configdata.pm -print \
            > "$GITHUB_WORKSPACE/openssl-configdata-paths.txt"
    
          while IFS= read -r f; do
            echo
            echo "===== $f ====="
            (cd "$(dirname "$f")" && perl ./configdata.pm --dump)
          done < "$GITHUB_WORKSPACE/openssl-configdata-paths.txt"
    
          echo
          echo "===== MD5 source/object files ====="
          find build_dir -type f \
            \( -iname '*md5*.S' -o -iname '*md5*.s' \
            -o -iname '*md5*.o' -o -iname '*md5*.c' \) -print
        } > "$GITHUB_WORKSPACE/openssl-diagnostics.txt" 2>&1
    
    - name: Upload OpenSSL diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openssl-diagnostics
        path: |
          openssl-build.log
          openssl-diagnostics.txt
          openssl-configdata-paths.txt
        if-no-files-found: warn
        retention-days: 7
