name: 360T7 Firmware Configuration Publisher

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        type: choice
        required: true
        default: 'openwrt-25.12'
        options:
          - 'openwrt-25.12'
          - 'openwrt-25.12-dae'
          - 'openwrt-25.12-honk'
          - 'openwrt-25.12-ubi'
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'
      openwrt_source:
        description: 'OpenWrt 源码方案'
        type: choice
        required: true
        default: 'openwrt'
        options:
          - 'openwrt'
          - 'mediatek-sdk'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone Firmware Source
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
        run: |
          case "$FIRMWARE_VERSION" in
            openwrt-25.12|openwrt-25.12-dae|openwrt-25.12-honk|openwrt-25.12-ubi)
              REPO="https://github.com/openwrt/openwrt.git"
              BRANCH="openwrt-25.12"
              ;;
            immortalwrt-21.02)
              REPO="https://github.com/hanwckf/immortalwrt-mt798x.git"
              BRANCH="openwrt-21.02"
              ;;
            immortalwrt-25.12)
              REPO="https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git"
              BRANCH="25.12"
              ;;
            *)
              echo "::error::Unsupported firmware version: $FIRMWARE_VERSION"
              exit 1
              ;;
          esac

          echo "固件版本：$FIRMWARE_VERSION"
          echo "源码仓库：$REPO"
          echo "源码分支：$BRANCH"

          git clone --depth 1 -b "$BRANCH" "$REPO" openwrt

      - name: Clone MediaTek SDK Feeds
        if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
        run: |
          git clone --depth 1 -b main \
            https://github.com/mediatek/mtk-openwrt-feeds.git \
            mtk-openwrt-feeds

      - name: Configure Feeds and Theme
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
        run: |
          cd openwrt

          # Passwall & honk feeds
          {
            printf '%s\n' \
              'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' \
              'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' \
              'src-git daeuniverse_packages https://github.com/daeuniverse/openwrt-packages.git;main'
            cat feeds.conf.default
          } > feeds.conf.default.tmp && mv feeds.conf.default.tmp feeds.conf.default

          # Aurora 主题
          git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          git clone --depth 1 https://github.com/eamonxg/luci-app-aurora-config.git package/luci-app-aurora-config

      - name: Update Feeds
        if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install Feeds
        if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
        run: cd openwrt && ./scripts/feeds install -a

      - name: Prepare MediaTek SDK
        if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
        run: |
          cd openwrt
          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh list
          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh filogic-mac80211 prepare

      - name: Configure MediaTek SDK for Qihoo 360T7
        if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
        run: |
          cd openwrt

          # 修改 .config 中的 Kconfig 选项
          set_config() {
            local option="$1"
            local value="$2"

            sed -i -E \
              "/^# ${option} is not set$/d; /^${option}=/d" \
              .config

            if [ "$value" = "n" ]; then
              echo "# ${option} is not set" >> .config
            else
              echo "${option}=${value}" >> .config
            fi
          }

          # 1. 单设备构建
          set_config CONFIG_TARGET_MULTI_PROFILE n
          set_config CONFIG_TARGET_PER_DEVICE_ROOTFS y

          # 清除其他 Filogic 设备选择
          sed -i -E \
            '/^(# )?CONFIG_TARGET_(DEVICE_)?mediatek_filogic_DEVICE_.*$/d' \
            .config

          # 只选择 Qihoo 360T7（普通分区布局）
          set_config CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7 y

          # 2. 保留 360T7 所需无线驱动
          set_config CONFIG_PACKAGE_kmod-mt7915e y
          set_config CONFIG_PACKAGE_kmod-mt7981-firmware y

          # WO 固件由 360T7 的 DEVICE_PACKAGES 引入
          set_config CONFIG_PACKAGE_mt7981-wo-firmware n

          # 3. 禁用其他 SoC 的专用固件
          set_config CONFIG_PACKAGE_mt7988-wo-firmware n
          set_config CONFIG_PACKAGE_kmod-mt7986-firmware n
          set_config CONFIG_PACKAGE_kmod-mt7990-firmware n
          set_config CONFIG_PACKAGE_kmod-mt7992-23-firmware n
          set_config CONFIG_PACKAGE_kmod-mt7992-firmware n
          set_config CONFIG_PACKAGE_kmod-mt7996-233-firmware n

          # 4. 重新执行 Kconfig 依赖解析
          make defconfig

          # 5. 检查最终设备选择
          echo "========== Target Configuration =========="

          grep -E '^(CONFIG_TARGET_MULTI_PROFILE=|# CONFIG_TARGET_MULTI_PROFILE is not set|CONFIG_TARGET_PER_DEVICE_ROOTFS=|CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y)' .config

          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y$' .config; then
            echo "::error::Qihoo 360T7 target configuration is missing!"
            exit 1
          fi

          OTHER_DEVICES=$(grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y$' .config \
            | grep -v 'CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y' || true)
          
          if [ -n "$OTHER_DEVICES" ]; then
            echo "::error::Unexpected device profiles:"
            echo "$OTHER_DEVICES"
            exit 1
          fi

          echo "========== Firmware Configuration =========="

          grep -E '^(CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware|mt7988-wo-firmware|kmod-mt7986-firmware|kmod-mt7990-firmware|kmod-mt7992-23-firmware|kmod-mt7992-firmware|kmod-mt7996-233-firmware)=|# CONFIG_PACKAGE_(mt7981-wo-firmware|mt7988-wo-firmware|kmod-mt7986-firmware|kmod-mt7990-firmware|kmod-mt7992-23-firmware|kmod-mt7992-firmware|kmod-mt7996-233-firmware) is not set)' .config || true

          echo "360T7 single-device configuration completed."

      - name: Apply OpenWrt Device Defconfig
        if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
        run: |
          cd openwrt
          case "$FIRMWARE_VERSION" in
            openwrt-25.12|openwrt-25.12-dae|openwrt-25.12-honk|openwrt-25.12-ubi)
              CONFIG_FILE="$GITHUB_WORKSPACE/config/defconfig-openwrt-25.12.config"
              ;;
            *)
              echo "::notice::当前版本无需应用此 Defconfig：$FIRMWARE_VERSION"
              exit 0
              ;;
          esac
          echo "配置文件路径：$CONFIG_FILE"
          if [ -f "$CONFIG_FILE" ]; then
            cp -f "$CONFIG_FILE" .config
          else
            echo "::warning::配置文件不存在，跳过复制：$CONFIG_FILE"
          fi

      - name: Apply ImmortalWrt Device Defconfig
        if: ${{ startsWith(inputs.version, 'immortalwrt-') }}
        run: |
          cd openwrt
          cp -f defconfig/mt7981-ax3000.config .config

      - name: SmartDNS
        run: |
          cd openwrt
          rm -rf feeds/packages/net/smartdns
          git clone --depth 1 https://github.com/pymumu/openwrt-smartdns.git feeds/packages/net/smartdns
          rm -rf feeds/luci/applications/luci-app-smartdns
          git clone --depth 1 https://github.com/pymumu/luci-app-smartdns.git feeds/luci/applications/luci-app-smartdns

      - name: Replace
        if: ${{ startsWith(inputs.version, 'openwrt-') }}
        run: |
          cd openwrt
          sed -i 's/ +v2ray-geoip +v2ray-geosite//' ./feeds/daeuniverse_packages/dae/Makefile ./feeds/daeuniverse_packages/honk/Makefile

      - name: 【先q 后cd openwrt && make menuconfig 完sudo touch /continue】
        uses: Warpbuilds/action-debugger@v2
        timeout-minutes: 50
        with:
          limit-access-to-actor: false

      - name: Publish Firmware Configuration
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
          OPENWRT_SOURCE: ${{ inputs.openwrt_source }}
        run: |
          cd openwrt
          CONFIG_SUFFIX=""
          if [ "$OPENWRT_SOURCE" = "mediatek-sdk" ]; then
            CONFIG_SUFFIX="-mtk"
          fi
          CONFIG_NAME="${FIRMWARE_VERSION}${CONFIG_SUFFIX}.config"
          echo "发布配置：./publish/${CONFIG_NAME}"
          install -Dp .config "./publish/${CONFIG_NAME}"

      - name: Sync Configurations to Repository
        run: |
          mkdir -p config
          cp -f openwrt/publish/*.config config/

      - name: Commit and Push Configurations
        env:
          FIRMWARE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/
          if git diff --cached --quiet; then
            echo "配置文件没有变化，无需提交。"
          else
            git commit -m "Update firmware config: ${FIRMWARE_VERSION}"
            git push
          fi

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
