name: 360T7-config

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      run: |
        #sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

    - name: download
      run: git clone https://github.com/hanwckf/immortalwrt-mt798x.git

    - name: update
      run: cd immortalwrt-mt798x && ./scripts/feeds update -a

    - name: install
      run: cd immortalwrt-mt798x && ./scripts/feeds install -a

    - name: cp
      run: cd immortalwrt-mt798x && cp -f defconfig/mt7981-ax3000.config .config

    - name: passwall
      run: |
        cd immortalwrt-mt798x
        # 移除 openwrt feeds 自带的核心库
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
        # 移除 openwrt feeds 过时的luci版本
        rm -rf feeds/luci/applications/luci-app-passwall
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci
        # 替换规则
        sed -i '/gfwlist\/gfwlist"/a\o:value("https://github.com/najloa/geoip/releases/latest/download/proxy.txt", translate("najloa/proxy"))' ./package/passwall-luci/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/ChinaMax_Domain"/a\o:value("https://github.com/najloa/geoip/releases/latest/download/twitchcdn.txt", translate("najloa/twitch-cdn"))' ./package/passwall-luci/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/ChinaMax_Domain"/a\o:value("https://github.com/najloa/geoip/releases/latest/download/cn.txt", translate("najloa/cn"))' ./package/passwall-luci/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/MetaCubeX\/geosite (CDN)"/a\	o:value("https://github.com/najloa/geoip/releases/latest/download/geosite.dat", translate("najloa/geosite"))' ./package/passwall-luci/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i '/MetaCubeX\/geoip (CDN)"/a\	o:value("https://github.com/najloa/geoip/releases/latest/download/geoip.dat", translate("najloa/geoip"))' ./package/passwall-luci/luci-app-passwall/luasrc/model/cbi/passwall/client/rule.lua
        sed -i 's|local excluded_domain = {[^}]*}|local excluded_domain = {}|g' ./package/passwall-luci/luci-app-passwall/root/usr/share/passwall/rule_update.lua
        > ./package/passwall-luci/luci-app-passwall/root/usr/share/passwall/rules/chnlist
        curl -s https://core.telegram.org/resources/cidr.txt > ./package/passwall-luci/luci-app-passwall/root/usr/share/passwall/rules/proxy_ip

        # 1. 替换版本号为日期变量
        sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=$(shell date +%Y.%m.%d)/' feeds/packages/net/smartdns/Makefile
        # 2. 删除源码压缩包定义
        sed -i '/^PKG_SOURCE:=/d' feeds/packages/net/smartdns/Makefile
        # 3. 删除原下载地址
        sed -i '/^PKG_SOURCE_URL:=/d' feeds/packages/net/smartdns/Makefile
        # 4. 删除安全校验 hash
        sed -i '/^PKG_HASH:=/d' feeds/packages/net/smartdns/Makefile
        # 5. 删除原构建目录定义
        sed -i '/^PKG_BUILD_DIR:=/d' feeds/packages/net/smartdns/Makefile
        # 6. 插入 git 下载配置（在 PKG_RELEASE 后插入）
        sed -i '/^PKG_RELEASE:=/a \
        \
        PKG_SOURCE_PROTO:=git\
        PKG_SOURCE_URL:=https://github.com/pymumu/smartdns.git\
        PKG_SOURCE_VERSION:=HEAD\
        PKG_SOURCE_SUBDIR:=$(PKG_NAME)-git\
        PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_SOURCE_SUBDIR)\
        ' feeds/packages/net/smartdns/Makefile

        sed -i 's|$(INSTALL_CONF) $(CURDIR)/conf/custom.conf $(1)/etc/smartdns/custom.conf|$(INSTALL_CONF) $(PKG_BUILD_DIR)/package/openwrt/custom.conf $(1)/etc/smartdns/custom.conf|' feeds/packages/net/smartdns/Makefile
        sed -i 's|$(INSTALL_CONF) $(CURDIR)/conf/smartdns.conf $(1)/etc/config/smartdns|$(INSTALL_CONF) $(PKG_BUILD_DIR)/package/openwrt/files/etc/config/smartdns $(1)/etc/config/smartdns|' feeds/packages/net/smartdns/Makefile
        sed -i 's|DEPENDS:=+libpthread +libopenssl|DEPENDS:=+libpthread +libopenssl +libatomic|' feeds/packages/net/smartdns/Makefile

        rm -rf feeds/packages/net/smartdns/conf

        rm -rf feeds/luci/applications/luci-app-smartdns
        git clone -b master https://github.com/immortalwrt/luci.git tmp_smartdns2
        \cp -rf tmp_smartdns2/applications/luci-app-smartdns/ feeds/luci/applications/luci-app-smartdns/
        # 版本 https://github.com/immortalwrt/luci/blob/openwrt-21.02/applications/luci-app-smartdns/Makefile
        sed -i '/^LUCI_DEPENDS:=+smartdns/,/include \.\.\/\.\.\/luci.mk/c\
        LUCI_DEPENDS:=+smartdns\
        LUCI_PKGARCH:=all\
        \
        include ../../luci.mk' feeds/luci/applications/luci-app-smartdns/Makefile
        rm -rf tmp_smartdns2

    - name: 【步骤】
      run: echo "【输入q 然后cd immortalwrt-mt798x && make menuconfig 结束sudo touch /continue】"
    - name: Setup tmate session # https://github.com/mxschmitt/action-tmate https://github.com/marketplace/actions/debugging-with-ssh
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 45

    - name: config
      run: |
        cd immortalwrt-mt798x
        cp -f .config 360T7.config

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 360T7
        path: immortalwrt-mt798x/360T7.config

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 0
