name: Build OpenWrt 25.12 - Qihoo 360T7

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libxml-parser-perl \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            rsync \
            swig \
            time \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            zstd

      - name: Checkout OpenWrt 25.12
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Checkout MediaTek OpenWrt feeds
        run: |
          git clone \
            --depth 1 \
            https://github.com/mediatek/mtk-openwrt-feeds.git \
            mtk-openwrt-feeds

      - name: Prune MediaTek defconfigs
        run: |
          bash scripts/prune-mtk-defconfig.sh \
            "$GITHUB_WORKSPACE/mtk-openwrt-feeds"

      - name: Apply MediaTek OpenWrt files and patches
        working-directory: openwrt
        run: |
          set -e
          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
            filogic-mac80211-mt798x_rfb-wifi6_nic \
            prepare log_file=prepare

      - name: Configure Qihoo 360T7
        working-directory: openwrt
        run: |
          cat ../config/defconfig-openwrt-25.12.config >> .config
          make defconfig

      - name: Save final config
        working-directory: openwrt
        run: |
          ./scripts/diffconfig.sh > diffconfig

      - name: Upload final config
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-360t7-config
          path: |
            openwrt/.config
            openwrt/diffconfig
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -e
          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
            build log_file=build

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
