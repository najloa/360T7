name: Build OpenWrt 25.12 - Qihoo 360T7

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libxml-parser-perl \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            rsync \
            swig \
            time \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            zstd

      - name: Checkout OpenWrt 25.12
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Checkout MediaTek OpenWrt feeds
        run: |
          git clone \
            --depth 1 \
            https://github.com/mediatek/mtk-openwrt-feeds.git \
            mtk-openwrt-feeds

      - name: MediaTek
        working-directory: openwrt
        run: bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh list

      - name: Apply MediaTek OpenWrt files and patches
        working-directory: openwrt
        run: |
          set -e

          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
            filogic-mac80211-mt798x_rfb-wifi6_nic \
            prepare log_file=prepare

      - name: Configure Qihoo 360T7
        working-directory: openwrt
        run: |
          set -e

          python3 - <<'PY'
          import re
          from pathlib import Path

          config = Path(".config")
          minimal = Path(
              "../config/defconfig-openwrt-25.12.config"
          )

          lines = config.read_text().splitlines()

          def set_config(name, value):
              global lines

              lines = [
                  line for line in lines
                  if not (
                      line.startswith(name + "=")
                      or line == f"# {name} is not set"
                  )
              ]

              if value == "n":
                  lines.append(f"# {name} is not set")
              else:
                  lines.append(f"{name}={value}")

          # Disable all other device profiles inherited
          # from the MediaTek multi-profile configuration.
          other_devices = set()

          for line in lines:
              match = re.match(
                  r"^(CONFIG_TARGET_DEVICE_[A-Za-z0-9_]+)=y$",
                  line
              )
              if match:
                  other_devices.add(match.group(1))

          for name in other_devices:
              set_config(name, "n")

          # Disable multi-profile builds.
          set_config("CONFIG_TARGET_MULTI_PROFILE", "n")
          set_config("CONFIG_TARGET_PER_DEVICE_ROOTFS", "n")

          # Apply the minimal Qihoo 360T7 target configuration.
          for line in minimal.read_text().splitlines():
              if line.startswith("CONFIG_") and "=" in line:
                  name, value = line.split("=", 1)
                  set_config(name, value)

          # Ensure MT7981 wireless components are enabled.
          for name in (
              "CONFIG_PACKAGE_mt7981-wo-firmware",
              "CONFIG_PACKAGE_kmod-mt7981-firmware",
              "CONFIG_PACKAGE_kmod-mt7915e",
              "CONFIG_PACKAGE_iw-full",
          ):
              set_config(name, "y")

          # Disable firmware and drivers for unrelated chipsets.
          excluded_packages = (
              "mt7986-wo-firmware",
              "mt7988-wo-firmware",
              "kmod-mt7986-firmware",
              "kmod-mt7990-firmware",
              "kmod-mt7992-23-firmware",
              "kmod-mt7992-firmware",
              "kmod-mt7996-233-firmware",
              "kmod-mt7996-firmware",
          )

          for package in excluded_packages:
              set_config(
                  f"CONFIG_PACKAGE_{package}",
                  "n"
              )

          config.write_text("\n".join(lines) + "\n")
          PY

          # Resolve dependencies and generate the final configuration.
          make defconfig

          echo "========== Target Configuration =========="

          grep -E \
            '^CONFIG_TARGET_(mediatek|TARGET_MULTI_PROFILE|TARGET_PER_DEVICE_ROOTFS)' \
            .config || true

          grep -E \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y$' \
            .config

          echo "========== MT7981 Wireless Configuration =========="

          grep -E \
            '^CONFIG_PACKAGE_(mt7981-wo-firmware|kmod-mt7981-firmware|kmod-mt7915e|iw-full)=' \
            .config

          # Ensure no unrelated chipset firmware remains enabled.
          if grep -E \
            '^CONFIG_PACKAGE_(mt7986-wo-firmware|mt7988-wo-firmware|kmod-mt7986-firmware|kmod-mt7990-firmware|kmod-mt7992-23-firmware|kmod-mt7992-firmware|kmod-mt7996-233-firmware|kmod-mt7996-firmware)=(y|m)$' \
            .config
          then
            echo "ERROR: Unrelated chipset firmware is enabled!"
            exit 1
          fi

          echo "========== Configuration Complete =========="

      - name: Save final config
        working-directory: openwrt
        run: |
          ./scripts/diffconfig.sh > diffconfig

      - name: Upload final config
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-360t7-config
          path: |
            openwrt/.config
            openwrt/diffconfig
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -e

          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
            build log_file=build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-Qihoo-360T7
          path: |
            openwrt/bin/targets/mediatek/filogic/
            openwrt/.config
          if-no-files-found: error
          retention-days: 3

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
