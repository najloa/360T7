name: 固件构建测试

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout 8d054d984a54c9ff4a733b14cd7400742e844b46

      - name: Clone MediaTek feeds
        run: git clone --branch main https://github.com/mediatek/mtk-openwrt-feeds.git

      - name: Build
        run: |
          cd openwrt
          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh filogic-mac80211 log_file=make

      - name: Prepare firmware path
        run: |
          echo "FIRMWARE=$GITHUB_WORKSPACE/openwrt/autobuild_release/filogic-mac80211" >> "$GITHUB_ENV"

      - name: Inspect firmware
        run: |
          echo "========== autobuild_release =========="
          find openwrt/autobuild_release -type f -printf '%p %s bytes\n' | sort

          echo "========== bin/targets =========="
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 \
            -type f -printf '%p %s bytes\n' 2>/dev/null | sort

      - name: Generate release information
        id: release
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "tag=360t7-test-$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: 360T7 OpenWrt 25.12 Test ${{ steps.release.outputs.date }}
          files: |
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.fip
            ${{ env.FIRMWARE }}/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
