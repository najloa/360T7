name: Test MediaTek SDK Integration - 360T7

on:
  workflow_dispatch:
    inputs:
      build_firmware:
        description: "Run a full firmware build after preparation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-mtk-360t7
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev

      - name: Checkout OpenWrt 25.12
        run: |
          git clone --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            "$GITHUB_WORKSPACE/openwrt"

      - name: Checkout MediaTek feeds
        run: |
          git clone --depth 1 \
            --branch main \
            https://github.com/mediatek/mtk-openwrt-feeds.git \
            "$GITHUB_WORKSPACE/mtk-openwrt-feeds"

      - name: Record source revisions
        run: |
          {
            echo "OpenWrt:"
            git -C openwrt rev-parse HEAD
            echo
            echo "MediaTek feeds:"
            git -C mtk-openwrt-feeds rev-parse HEAD
          } | tee source-revisions.txt

      - name: Seed 360T7 device configuration
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y
          EOF

          echo "Initial device configuration:"
          cat .config

      - name: Run MediaTek SDK prepare
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail

          bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
            filogic prepare 2>&1 | tee ../prepare.log

      - name: Select 360T7 device
        working-directory: openwrt
        run: |
          set -euo pipefail

          # SDK uses multi-profile mode.
          grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config

          # Remove the previous disabled entry, then select 360T7.
          sed -i '/^# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7 is not set$/d' .config

          echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y' >> .config

          make defconfig

          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y' .config
          echo "[OK] 360T7 device selected"

      - name: Validate 360T7 configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "Running make defconfig again to verify final Kconfig resolution..."
          make defconfig

          check_config() {
            if ! grep -qx "$1" .config; then
              echo "::error::Missing configuration: $1"
              return 1
            fi
            echo "[OK] $1"
          }

          check_config "CONFIG_TARGET_mediatek=y"
          check_config "CONFIG_TARGET_mediatek_filogic=y"
          check_config "CONFIG_TARGET_MULTI_PROFILE=y"
          check_config "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y"

          echo
          echo "Final target configuration:"
          grep -E '^CONFIG_TARGET_(mediatek|mediatek_filogic|MULTI_PROFILE|DEVICE_mediatek)' .config

          ./scripts/diffconfig.sh > ../final-diffconfig
          echo
          echo "Final diffconfig:"
          cat ../final-diffconfig

      - name: Validate 360T7 source files
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "Searching for 360T7 device files..."
          find target/linux/mediatek -iname '*360t7*' -print

          if ! find target/linux/mediatek -iname '*360t7*' \
              -print -quit | grep -q .; then
            echo "::error::No 360T7 device file found in target/linux/mediatek"
            exit 1
          fi

          echo
          echo "Checking device references:"
          grep -R -n -i 'qihoo_360t7\|qihoo,360t7' \
            target/linux/mediatek || true

      - name: Optional firmware build
        if: ${{ inputs.build_firmware }}
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../build.log

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics

          cp source-revisions.txt diagnostics/ 2>/dev/null || true
          cp prepare.log diagnostics/ 2>/dev/null || true
          cp final-diffconfig diagnostics/ 2>/dev/null || true
          cp build.log diagnostics/ 2>/dev/null || true
          cp openwrt/.config diagnostics/ 2>/dev/null || true

          if [ -d openwrt/bin/targets ]; then
            cp -a openwrt/bin/targets diagnostics/targets
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtk-360t7-diagnostics
          path: diagnostics/
          retention-days: 14
          if-no-files-found: warn
