name: 360T7-2410-ipk-fast

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

    - name: download
      run: git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-6.6 immortalwrt-mt798x

    - name: Update feeds
      run: cd immortalwrt-mt798x && ./scripts/feeds update -a

    - name: Install feeds
      run: cd immortalwrt-mt798x && ./scripts/feeds install -a

    - name: Replace
      run: |
        cd immortalwrt-mt798x
        rm -rf feeds/packages/lang/golang
        git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
        # 移除 openwrt feeds 自带的核心库
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
        # 移除 openwrt feeds 过时的luci版本
        rm -rf feeds/luci/applications/luci-app-passwall
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci

    - name: Prepare
      run: |
        cd immortalwrt-mt798x
        cp -f $GITHUB_WORKSPACE/config/360T7_2410_ipk.config .config
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Toolchain
      run: |
        cd immortalwrt-mt798x
        make toolchain/install -j$(nproc) || true

    - name: Target minimal
      run: |
        cd immortalwrt-mt798x
        make target/compile -j$(nproc) || true

    - name: Build packages
      run: |
        cd immortalwrt-mt798x
        make package/luci-app-passwall/compile -j$(nproc) V=s
        make package/xray-core/compile -j$(nproc) V=s
        make package/sing-box/compile -j$(nproc) V=s
        make package/tcping/compile -j$(nproc) V=s
        make package/microsocks/compile -j$(nproc) V=s
        make package/ipt2socks/compile -j$(nproc) V=s
        make package/geoview/compile -j$(nproc) V=s
        make package/dns2socks/compile -j$(nproc) V=s
        make package/chinadns-ng/compile -j$(nproc) V=s
        make package/luci-app-smartdns/compile -j$(nproc) V=s

    - name: Locate ipk
      run: |
        mkdir -p ipk-out
        find ./ -type f -name '*passwall*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*smartdns*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*chinadns-ng*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*dns2socks*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*geoview*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*ipt2socks*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*microsocks*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*tcping*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*xray*.ipk' -exec cp {} ipk-out/ \;
        find ./ -type f -name '*sing-box*.ipk' -exec cp {} ipk-out/ \;

    - name: Get latest release tag
      id: get_latest
      run: |
        response=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
        tag=$(echo "$response" | jq -r .tag_name)

        if [ "$tag" = "null" ] || [ -z "$tag" ]; then
          echo "No release found"
          exit 1
        fi

        echo "tag=$tag" >> $GITHUB_OUTPUT

    - name: Pack IPK files (zip)
      run: |
        cd ipk-out
        zip -r ../ipk2410.zip .

    - name: Upload to latest release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_latest.outputs.tag }}
        files: ipk2410.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
