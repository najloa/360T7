name: 360T7 固件构建发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        required: true
        type: choice
        default: 'openwrt-25.12'
        options:
          - 'openwrt-25.12'
          - 'openwrt-25.12-dae'
          - 'openwrt-25.12-honk'
          - 'openwrt-25.12-ubi'
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'
      openwrt_source:
        description: 'OpenWrt 源码方案'
        type: choice
        required: true
        default: 'openwrt'
        options:
          - 'openwrt'
          - 'mediatek-sdk'

permissions:
  contents: write
  actions: write

env:
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set build configuration
      env:
        FIRMWARE_VERSION: ${{ inputs.version }}
        OPENWRT_SOURCE: ${{ inputs.openwrt_source }}
      run: |
        if [[ "$OPENWRT_SOURCE" == "mediatek-sdk" && "$FIRMWARE_VERSION" != openwrt-* ]]; then
          echo "::error::MediaTek SDK is only supported for OpenWrt versions."
          exit 1
        fi
        case "${{ inputs.version }}" in
          openwrt-25.12)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12" >> $GITHUB_ENV
            ;;
          openwrt-25.12-dae)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-dae.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            ;;
          openwrt-25.12-honk)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-honk.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-honk" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-honk" >> $GITHUB_ENV
            ;;
          openwrt-25.12-ubi)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-ubi.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            ;;
          immortalwrt-21.02)
            echo "REPO_URL=https://github.com/hanwckf/immortalwrt-mt798x" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-21.02" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-21.02.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-21.02.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            ;;
          *)
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
            ;;
        esac

        if [[ "$OPENWRT_SOURCE" == "mediatek-sdk" && "$FIRMWARE_VERSION" == openwrt-* ]]; then
          echo "CONFIG_FILE=./config/${FIRMWARE_VERSION}-mtk.config" >> "$GITHUB_ENV"
        fi

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libxml-parser-perl \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            rsync \
            swig \
            time \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            zstd
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Update feeds
      if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
      run: cd openwrt && ./scripts/feeds install -a

    - name: Clone MediaTek SDK Feeds
      if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
      run: |
        git clone --depth 1 -b main \
          https://github.com/mediatek/mtk-openwrt-feeds.git \
          mtk-openwrt-feeds

    - name: Prune MediaTek defconfigs
      if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
      run: |
        bash scripts/prune-mtk-defconfig.sh \
          "$GITHUB_WORKSPACE/mtk-openwrt-feeds"

    - name: Prepare MediaTek SDK
      working-directory: openwrt
      if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
      run: |
        set -e
        bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
          filogic-mac80211-mt798x_rfb-wifi6_nic \
          prepare log_file=prepare

    - name: Load custom configuration
      working-directory: openwrt
      env:
        FIRMWARE_VERSION: ${{ inputs.version }}
        OPENWRT_SOURCE: ${{ inputs.openwrt_source }}
      run: |
        #[ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        cp -f ../config/openwrt-25.12-mtk.config .config

    - name: Download package
      id: package
      if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Install WED and mt76 Patches
      if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
      run: |
        cd openwrt
        KERNEL_PATCHVER=$(sed -n 's/^KERNEL_PATCHVER:=//p' \
          target/linux/mediatek/Makefile | head -n 1)
        if [ -z "$KERNEL_PATCHVER" ]; then
          echo "::error::Cannot determine KERNEL_PATCHVER"
          exit 1
        fi
        KERNEL_PATCH_DIR="target/linux/mediatek/patches-$KERNEL_PATCHVER"
        MT76_PATCH_DIR="package/kernel/mt76/patches"
        mkdir -p "$KERNEL_PATCH_DIR" "$MT76_PATCH_DIR"
        cp "$GITHUB_WORKSPACE/scripts/999-001-mtk-wed-reduce-rx-ring-size.patch" \
          "$KERNEL_PATCH_DIR/"
        cp "$GITHUB_WORKSPACE/scripts/999-003-mtk-eth.patch" \
          "$KERNEL_PATCH_DIR/"
        cp "$GITHUB_WORKSPACE/scripts/999-002-mt7915-reduce-rx-ring-size.patch" \
          "$MT76_PATCH_DIR/"
        echo "Kernel patch installed: $KERNEL_PATCH_DIR"
        echo "mt76 patch installed: $MT76_PATCH_DIR"

    - name: Build OpenWrt MediaTek SDK
      working-directory: openwrt
      if: ${{ startsWith(inputs.version, 'openwrt-') && inputs.openwrt_source == 'mediatek-sdk' }}
      run: |
        set -e
        bash ../mtk-openwrt-feeds/autobuild/unified/autobuild.sh \
          build log_file=build

    - name: Compile the firmware
      id: compile
      if: ${{ !startsWith(inputs.version, 'openwrt-') || inputs.openwrt_source == 'openwrt' }}
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Prepare firmware path
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Generate build date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}-${{ steps.date.outputs.date }}
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.fip
          ${{ env.FIRMWARE }}/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 1
