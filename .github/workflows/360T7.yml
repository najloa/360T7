name: 360T7

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        required: true
        type: choice
        default: 'openwrt-25.12'
        options:
          - 'openwrt-25.12'
          - 'openwrt-25.12-dae'
          - 'openwrt-25.12-ubi'
          - 'openwrt-main-honk'
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'

permissions:
  contents: write
  actions: write

env:
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set build configuration
      run: |
        case "${{ inputs.version }}" in
          openwrt-25.12)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12" >> $GITHUB_ENV
            ;;
          openwrt-25.12-dae)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-dae.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            ;;
          openwrt-25.12-ubi)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-ubi.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            ;;
          openwrt-main-honk)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=main" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-main-honk.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-main-honk" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-main-honk" >> $GITHUB_ENV
            ;;
          immortalwrt-21.02)
            echo "REPO_URL=https://github.com/hanwckf/immortalwrt-mt798x" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-21.02" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-21.02.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-21.02.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            ;;
          *)
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
            ;;
        esac

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential bzip2 gawk libncurses-dev \
          clang llvm libbpf-dev pkg-config \
          cmake libclang-dev binutils git curl ca-certificates
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: SmartDNS
      run: |
        cd openwrt
        rm -rf feeds/packages/net/smartdns
        git clone --depth 1 https://github.com/pymumu/openwrt-smartdns.git feeds/packages/net/smartdns
        rm -rf feeds/luci/applications/luci-app-smartdns
        git clone --depth 1 https://github.com/pymumu/luci-app-smartdns.git feeds/luci/applications/luci-app-smartdns

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        FIRMWARE_VERSION: ${{ inputs.version }}
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Locate and Generate Driver Patches
      run: |
        cd openwrt
    
        # 准备两套源码
        make target/linux/prepare -j1
        make package/kernel/mt76/prepare -j1
    
        # 定位内核源码
        LINUX_DIR=$(find build_dir/target-* -type f \
          -path '*/drivers/net/ethernet/mediatek/mtk_wed.c' \
          -print -quit | sed 's#/drivers/net/ethernet/mediatek/mtk_wed.c##')
    
        # 定位独立的 mt76 源码
        MT76_DIR=$(find build_dir/target-* -type f \
          -path '*/mt7915/mt7915.h' \
          -print -quit | sed 's#/mt7915/mt7915.h##')
    
        if [ -z "$LINUX_DIR" ] || [ -z "$MT76_DIR" ]; then
          echo "::error::Cannot locate Linux or mt76 source"
          exit 1
        fi
    
        MTK_WED="$LINUX_DIR/drivers/net/ethernet/mediatek/mtk_wed.c"
        MT7915="$MT76_DIR/mt7915/mt7915.h"
    
        mkdir -p /tmp/wed-patches
    
        # 备份原始文件
        cp "$MTK_WED" /tmp/mtk_wed.c.orig
        cp "$MT7915" /tmp/mt7915.h.orig
    
        # 修改 WED RX Ring
        sed -i -E \
          's/^(#define[[:space:]]+MTK_WED_RX_RING_SIZE[[:space:]]+)1536([[:space:]]*)$/\1 512/' \
          "$MTK_WED"
    
        # 修改 mt7915 RX Ring 和 WED Token
        sed -i -E \
          's/^(#define[[:space:]]+MT7915_RX_RING_SIZE[[:space:]]+)1536([[:space:]]*)$/\1 512/' \
          "$MT7915"
    
        sed -i -E \
          's/^(#define[[:space:]]+MT7915_WED_RX_TOKEN_SIZE[[:space:]]+)12288([[:space:]]*)$/\1 4096/' \
          "$MT7915"
    
        # 检查所有修改是否真正生效
        grep -Eq '^#define[[:space:]]+MTK_WED_RX_RING_SIZE[[:space:]]+512([[:space:]]|$)' "$MTK_WED" || {
          echo "::error::MTK_WED_RX_RING_SIZE modification failed"
          exit 1
        }
    
        grep -Eq '^#define[[:space:]]+MT7915_RX_RING_SIZE[[:space:]]+512([[:space:]]|$)' "$MT7915" || {
          echo "::error::MT7915_RX_RING_SIZE modification failed"
          exit 1
        }
    
        grep -Eq '^#define[[:space:]]+MT7915_WED_RX_TOKEN_SIZE[[:space:]]+4096([[:space:]]|$)' "$MT7915" || {
          echo "::error::MT7915_WED_RX_TOKEN_SIZE modification failed"
          exit 1
        }
    
        # 分别生成补丁，路径相对于各自源码根目录
        diff -u \
          --label a/drivers/net/ethernet/mediatek/mtk_wed.c \
          --label b/drivers/net/ethernet/mediatek/mtk_wed.c \
          /tmp/mtk_wed.c.orig "$MTK_WED" \
          > /tmp/wed-patches/999-001-mtk-wed-reduce-rx-ring-size.patch || [ $? -eq 1 ]
    
        diff -u \
          --label a/mt7915/mt7915.h \
          --label b/mt7915/mt7915.h \
          /tmp/mt7915.h.orig "$MT7915" \
          > /tmp/wed-patches/999-002-mt7915-reduce-rx-ring-size.patch || [ $? -eq 1 ]
    
        echo "===== WED patch ====="
        cat /tmp/wed-patches/999-001-mtk-wed-reduce-rx-ring-size.patch
    
        echo "===== mt76 patch ====="
        cat /tmp/wed-patches/999-002-mt7915-reduce-rx-ring-size.patch

    - name: Upload WED Patches
      uses: actions/upload-artifact@v4
      with:
        name: mtk-wed-mt76-patches
        path: |
          /tmp/wed-patches/999-001-mtk-wed-reduce-rx-ring-size.patch
          /tmp/wed-patches/999-002-mt7915-reduce-rx-ring-size.patch
        if-no-files-found: error
        retention-days: 7

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 0
