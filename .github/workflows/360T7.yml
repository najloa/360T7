name: 360T7

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        required: true
        type: choice
        default: 'immortalwrt-25.12'
        options:
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'
          - 'immortalwrt-25.12-dae'

permissions:
  contents: write
  actions: write

env:
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set build configuration
      run: |
        case "${{ inputs.version }}" in
          immortalwrt-21.02)
            echo "REPO_URL=https://github.com/hanwckf/immortalwrt-mt798x" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-21.02" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/360T7-21.02.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=diy-21.02.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/360T7-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=diy-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12-dae)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/360T7-25.12-dae.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=diy-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12-dae" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12-dae" >> $GITHUB_ENV
            ;;
          *)
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
            ;;
        esac

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Prepare firmware path
      run: |
        cd openwrt/bin/targets/*/*
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Generate build date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}-${{ steps.date.outputs.date }}
        files: |
          ${{ env.FIRMWARE }}/*.itb
          ${{ env.FIRMWARE }}/*.fip
          ${{ env.FIRMWARE }}/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 0
