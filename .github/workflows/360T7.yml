name: 360T7

on:
  workflow_dispatch:
    inputs:
      version:
        description: '选择固件编译版本'
        required: true
        type: choice
        default: 'openwrt-25.12'
        options:
          - 'openwrt-25.12'
          - 'openwrt-25.12-dae'
          - 'openwrt-25.12-ubi'
          - 'openwrt-main-honk'
          - 'immortalwrt-21.02'
          - 'immortalwrt-25.12'

permissions:
  contents: write
  actions: write

env:
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set build configuration
      run: |
        case "${{ inputs.version }}" in
          openwrt-25.12)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12" >> $GITHUB_ENV
            ;;
          openwrt-25.12-dae)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-dae.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-dae" >> $GITHUB_ENV
            ;;
          openwrt-25.12-ubi)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-25.12-ubi.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-25.12-ubi" >> $GITHUB_ENV
            ;;
          openwrt-main-honk)
            echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
            echo "REPO_BRANCH=main" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/openwrt-main-honk.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=openwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=openwrt-main-honk" >> $GITHUB_ENV
            echo "RELEASE_NAME=openwrt-main-honk" >> $GITHUB_ENV
            ;;
          immortalwrt-21.02)
            echo "REPO_URL=https://github.com/hanwckf/immortalwrt-mt798x" >> $GITHUB_ENV
            echo "REPO_BRANCH=openwrt-21.02" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-21.02.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-21.02.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-21.02" >> $GITHUB_ENV
            ;;
          immortalwrt-25.12)
            echo "REPO_URL=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_ENV
            echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
            echo "CONFIG_FILE=./config/immortalwrt-25.12.config" >> $GITHUB_ENV
            echo "DIY_P2_SH=immortalwrt-25.12.sh" >> $GITHUB_ENV
            echo "TAG_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            echo "RELEASE_NAME=immortalwrt-25.12" >> $GITHUB_ENV
            ;;
          *)
            echo "Invalid version: ${{ inputs.version }}"
            exit 1
            ;;
        esac

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential bzip2 gawk libncurses-dev \
          clang llvm libbpf-dev pkg-config \
          cmake libclang-dev binutils git curl ca-certificates
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        FIRMWARE_VERSION: ${{ inputs.version }}
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;





    - name: Locate and Upload Driver Sources
      run: |
        cd openwrt
        make target/linux/prepare -j1

        PATCH_DIR="target/linux/mediatek/patches-6.12"
        mkdir -p "$PATCH_DIR"
        
        LINUX_DIR=$(find build_dir/target-* -type f -path '*/drivers/net/ethernet/mediatek/mtk_wed.c' -print -quit | sed 's#/drivers/net/ethernet/mediatek/mtk_wed.c##')
        
        if [ -z "$LINUX_DIR" ]; then
            echo "::error::Linux source not found"
            exit 1
        fi
        
        MTK_WED="$LINUX_DIR/drivers/net/ethernet/mediatek/mtk_wed.c"
        MT7915="$LINUX_DIR/drivers/net/wireless/mediatek/mt76/mt7915/mt7915.h"
        
        cp "$MTK_WED" /tmp/mtk_wed.c.orig
        cp "$MT7915" /tmp/mt7915.h.orig
        
        sed -i 's/^#define MTK_WED_RX_RING_SIZE[[:space:]]*1536$/#define MTK_WED_RX_RING_SIZE\t\t512/' "$MTK_WED"
        sed -i 's/^#define MT7915_RX_RING_SIZE[[:space:]]*1536$/#define MT7915_RX_RING_SIZE\t\t512/' "$MT7915"
        sed -i 's/^#define MT7915_WED_RX_TOKEN_SIZE[[:space:]]*12288$/#define MT7915_WED_RX_TOKEN_SIZE\t4096/' "$MT7915"
        
        {
            diff -u --label a/drivers/net/ethernet/mediatek/mtk_wed.c \
                --label b/drivers/net/ethernet/mediatek/mtk_wed.c \
                /tmp/mtk_wed.c.orig "$MTK_WED" || true
        
            diff -u --label a/drivers/net/wireless/mediatek/mt76/mt7915/mt7915.h \
                --label b/drivers/net/wireless/mediatek/mt76/mt7915/mt7915.h \
                /tmp/mt7915.h.orig "$MT7915" || true
        } > "$PATCH_DIR/999-001-mtk-wed-mt7915-reduce-rx-ring-size.patch"
        
        echo "===== Generated patch ====="
        cat "$PATCH_DIR/999-001-mtk-wed-mt7915-reduce-rx-ring-size.patch"

    - name: Upload MTK WED Patch
      uses: actions/upload-artifact@v4
      with:
        name: mtk-wed-mt7915-patch
        path: openwrt/target/linux/mediatek/patches-6.12/999-001-mtk-wed-mt7915-reduce-rx-ring-size.patch
        if-no-files-found: error
        retention-days: 7









