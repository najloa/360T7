name: 360T7-24.10-config

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      run: sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

    - name: download
      run: git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-6.6 immortalwrt-mt798x

    - name: update
      run: cd immortalwrt-mt798x && ./scripts/feeds update -a

    - name: install
      run: cd immortalwrt-mt798x && ./scripts/feeds install -a

    - name: cp
      run: cd immortalwrt-mt798x && cp -f defconfig/mt7981-ax3000.config .config

    - name: 【步骤】
      run: echo "【输入q 然后cd immortalwrt-mt798x && make menuconfig 结束sudo touch /continue】"
    - name: Setup tmate session # https://github.com/mxschmitt/action-tmate https://github.com/marketplace/actions/debugging-with-ssh
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 45

    - name: config
      run: |
        cd immortalwrt-mt798x
        cp -f .config 360T7_2410.config

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 360T7_2410
        path: immortalwrt-mt798x/360T7_2410.config

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 0
